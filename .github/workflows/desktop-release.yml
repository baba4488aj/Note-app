name: Windows game release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lumenwild-windows-release
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-release.js
      - run: npm test
      - run: npm run check
      - name: Build Windows installer and update manifest
        run: npm run desktop:dist -- --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Stage release and upload the complete update set
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag --json isDraft *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Increase the version instead of replacing published update files." }
          gh release create $tag --target "${{ github.sha }}" --draft --title "Lumenwild $version" --notes "Windows installer with automatic updates. Existing saves are preserved."
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage the release.' }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 3) { throw 'Installer, blockmap, or update manifest is missing.' }
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; the release remains a draft and the live update feed is unchanged.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; inspect the draft release.' }
